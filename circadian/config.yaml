name: Circadian
version: "0.5.0"
slug: circadian
description: Glides lights between hand-tuned keyframes through the day, with a sun-gated morning wake. Manual changes always win.
url: https://github.com/halcyon100/home/tree/main/circadian
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
startup: application
boot: auto
options:
  shadow: true
  interval_seconds: 120
  enable_entity: input_boolean.circadian
  morning_reset: "07:00"
  early_wake_catch_up: "12:00"
  quiet_when_occupied: []
  daylight: []
  boost_entity: input_boolean.circadian_boost
  boost_factor: 1.5
  boost: []
  keyframes: []
schema:
  shadow: bool
  interval_seconds: int(30,600)
  enable_entity: str
  morning_reset: match(^\d{1,2}:\d{2}$)
  early_wake_catch_up: match(^\d{1,2}:\d{2}$)?
  quiet_when_occupied:
    - str
  boost_entity: str?
  boost_factor: float(1,3)?
  boost_ease_from: str?
  boost:
    - str
  daylight:
    - name: str
      sensor: str
      off_above: float
      on_below: float
      off_after_minutes: float?
      on_after_minutes: float?
      lights:
        - str
  keyframes:
    - name: str
      at: str
      step: bool?
      wake: bool?
      wake_if_sunrise_after: str?
      channel: list(both|brightness|color)?
      lights:
        - str
