<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Kitchen board</title>
<style>
@font-face{font-family:"Archivo";src:url("shared/archivo.woff2") format("woff2-variations");font-weight:100 900;font-stretch:62% 125%}
/* The Frame, on its side: 2160 × 3840, drawn at 1080 × 1920 and captured at 2× */
:root{--sun:#FFD27A;--moonline:rgb(232 238 248 / .85);--ink:#F4F1EA;--quiet:rgb(244 241 234 / .68);--hair:rgb(244 241 234 / .28);--glow:rgb(255 226 170 / .9)}
[data-ink="dark"]{--sun:#D9921C;--moonline:rgb(40 52 66 / .75);--ink:#15191C;--quiet:rgb(21 25 28 / .62);--hair:rgb(21 25 28 / .22);--glow:rgb(30 36 40 / .5)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0E151C}
body{font-family:"Archivo",system-ui,sans-serif;color:var(--ink);font-feature-settings:"tnum" 1,"case" 1;-webkit-font-smoothing:antialiased}
.sky{position:absolute;inset:0;background-size:cover;background-position:center}
.veil{position:absolute;inset:0}
/* A blur that rises from the bottom and tapers out mid-screen: stacked layers, each blurrier and lower */
.frost{position:absolute;left:0;right:0;bottom:0;height:62%;pointer-events:none}
.frost i{position:absolute;inset:0}
.frost i:nth-child(1){backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 22%);mask-image:linear-gradient(180deg,transparent 0%,#000 22%)}
.frost i:nth-child(2){backdrop-filter:blur(16px);-webkit-mask-image:linear-gradient(180deg,transparent 14%,#000 40%);mask-image:linear-gradient(180deg,transparent 14%,#000 40%)}
.frost i:nth-child(3){backdrop-filter:blur(34px) saturate(1.08);-webkit-mask-image:linear-gradient(180deg,transparent 30%,#000 60%);mask-image:linear-gradient(180deg,transparent 30%,#000 60%)}
.frost i:nth-child(4){background:linear-gradient(180deg,transparent 10%,var(--tint) 70%)}
:root{--tint:rgb(10 16 22 / .30)}
[data-ink="dark"]{--tint:rgb(244 245 246 / .38)}
.page{position:absolute;inset:0;padding:96px 88px 84px;display:flex;flex-direction:column}

/* Masthead */
.mast{display:flex;justify-content:space-between;align-items:baseline;font-size:34px;font-stretch:88%;letter-spacing:.005em}
.mast b{font-weight:560}
.mast span{color:var(--quiet)}
.today .th{display:flex;justify-content:space-between;align-items:baseline}
.today .th .moon{text-transform:none;letter-spacing:0;font-size:28px;font-weight:440;font-stretch:88%;color:var(--ink);white-space:nowrap}
.today .th .moon svg{display:inline-block;width:28px;height:28px;margin-right:12px;vertical-align:-6px}

/* Now: the number and the sentence */
.now{margin-top:52px;display:flex;align-items:flex-start;gap:34px}
.temp{font-size:270px;line-height:.8;font-weight:200;font-stretch:104%;letter-spacing:-.055em;margin-left:-14px}
.temp sup{font-size:.42em;vertical-align:.95em;margin-left:.02em;font-weight:250}
.hl{margin-top:22px;display:grid;gap:10px;font-size:34px;font-stretch:90%}
.hl span{display:flex;gap:16px;align-items:baseline}
.hl i{font-style:normal;color:var(--quiet);font-size:26px;font-stretch:84%;min-width:1.6em}
.say{margin:40px 0 0;font-size:72px;line-height:1.02;font-weight:290;font-stretch:96%;letter-spacing:-.028em;max-width:12.5ch}

/* Notable: only what's worth saying, with when */
.notes{list-style:none;margin:44px 0 0;padding:0;display:grid;gap:18px;font-size:36px;line-height:1.2;font-stretch:92%}
.notes li{display:grid;grid-template-columns:30px 1fr;gap:18px;align-items:baseline}
.notes li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translateY(-6px)}
.notes b{font-weight:560}
.notes span{color:var(--quiet)}

/* Today, hour by hour */
.today{margin-top:44px}
.today h2,.days h2,.inside h2{margin:0 0 18px;font-size:26px;font-weight:560;font-stretch:84%;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet)}
.today svg{display:block;width:100%;height:260px;overflow:visible}
.axis{position:relative;height:30px;font-size:24px;font-stretch:80%;color:var(--quiet);margin-top:12px}
.axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}

/* Three days */
.days{margin-top:auto;padding-top:40px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--hair)}
.col{padding:24px 0 0}
.col + .col{padding-left:34px;border-left:1.5px solid var(--hair)}
.col h3{margin:0;font-size:34px;font-weight:560;font-stretch:90%}
.col img{width:80px;height:80px;margin:6px 0 0 -14px;display:block}
.col .t{font-size:56px;font-weight:300;font-stretch:100%;letter-spacing:-.03em;line-height:1}
.col .t span{color:var(--quiet);font-size:40px;margin-left:.25em}
.col p{margin:14px 0 0;font-size:28px;line-height:1.3;font-stretch:88%;color:var(--quiet);max-width:12em}
.col p b{color:var(--ink);font-weight:520}

/* The house, in one quiet line */
.house{margin-top:44px;padding-top:24px;border-top:1.5px solid var(--hair);display:flex;flex-wrap:wrap;gap:12px 40px;font-size:30px;font-stretch:88%;color:var(--quiet)}
.house b{color:var(--ink);font-weight:520}

/* The day, together */
.key{display:flex;flex-wrap:wrap;gap:8px 30px;margin-top:10px;font-size:24px;font-stretch:82%;color:var(--quiet)}
.key i{display:inline-block;width:26px;height:0;vertical-align:.32em;margin-right:10px}
.key .kt{border-top:3.5px solid var(--ink)}
.key .ks{border-top:3px dotted var(--sun)}
.key .kl{height:10px;vertical-align:0;background:linear-gradient(90deg,#ffb46b,#fff1e0,#dfe8ff);opacity:.85;border-radius:2px}
.key .kr{width:8px;height:16px;vertical-align:-1px;background:var(--ink);opacity:.5;border-radius:2px}

/* Inside */
.inside{margin-top:40px;padding-top:22px;border-top:1.5px solid var(--hair)}
.inside h2{margin:0 0 10px;font-size:26px;font-weight:560;font-stretch:84%;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet)}
.in{display:flex;align-items:baseline;gap:36px}
.in .n{font-size:72px;font-weight:280;letter-spacing:-.03em;line-height:1}
.in .n small{font-size:.55em;margin-left:.04em}
.in .q{color:var(--ink)}
.in-notes{margin-left:auto;display:flex;gap:28px;font-size:30px;font-stretch:88%;color:var(--quiet)}
.in-notes b{color:var(--ink);font-weight:520}
</style>
</head>
<body>
<div class="sky" id="sky"></div><div class="veil" id="veil"></div><div class="frost"><i></i><i></i><i></i><i></i></div>
<main class="page" id="page"></main>
<script>
"use strict";
/* How each sky is graded for type: which ink, and a veil to calm the busy parts */
const SKY = {
  clear:    {ink:"light", veil:"linear-gradient(180deg,rgb(8 24 52 / .10),rgb(8 24 52 / .05) 40%,rgb(8 24 52 / .45))"},
  partly:   {ink:"light", veil:"linear-gradient(180deg,rgb(10 28 58 / .38),rgb(10 28 58 / .22) 45%,rgb(10 28 58 / .62))"},
  overcast: {ink:"dark",  veil:"linear-gradient(180deg,rgb(236 238 242 / .30),rgb(236 238 242 / .10) 50%,rgb(236 238 242 / .40))"},
  rain:     {ink:"dark",  veil:"linear-gradient(180deg,rgb(232 236 240 / .62),rgb(232 236 240 / .55) 45%,rgb(232 236 240 / .78))"},
  storm:    {ink:"light", veil:"linear-gradient(180deg,rgb(8 14 18 / .15),rgb(8 14 18 / 0) 40%,rgb(8 14 18 / .55))"},
  snow:     {ink:"dark",  veil:"linear-gradient(180deg,rgb(240 241 242 / .25),rgb(240 241 242 / .30) 50%,rgb(240 241 242 / .72))"},
  fog:      {ink:"dark",  veil:"linear-gradient(180deg,rgb(238 238 236 / .20),rgb(238 238 236 / .25) 45%,rgb(238 238 236 / .82))"},
};
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Colour temperature to sRGB (Tanner Helland's fit), so the house's light is drawn in its own colour */
function kRGB(k){
  const t=k/100; let r,g,b;
  if (t<=66){ r=255; g=99.4708025861*Math.log(t)-161.1195681661; }
  else { r=329.698727446*Math.pow(t-60,-0.1332047592); g=288.1221695283*Math.pow(t-60,-0.0755148492); }
  b = t>=66 ? 255 : t<=19 ? 0 : 138.5177312231*Math.log(t-10)-305.0447927307;
  const c=v=>Math.max(0,Math.min(255,Math.round(v)));
  return `rgb(${c(r)} ${c(g)} ${c(b)})`;
}
function smooth(pts){
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2; d+=` C${cx.toFixed(1)} ${y0.toFixed(1)} ${cx.toFixed(1)} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`; }
  return d;
}
/* The day on one clock: outside temperature (the line), the sun's height (dotted gold),
   the house's light (a soft band in its own colour) and the chance of rain (ticks at the foot) */
function chart(hours, nowIdx){
  const W=904, H=260, base=H-34, n=hours.length, x=i=>i/(n-1)*W;
  const ts=hours.map(h=>h.t), lo=Math.min(...ts)-2, hi=Math.max(...ts)+2, y=t=>44+(1-(t-lo)/(hi-lo))*(base-150);
  const pts=hours.map((h,i)=>[x(i),y(h.t)]);
  // house light: level as height, kelvin as colour
  let light="";
  if (hours.some(h=>h.light!=null)){
    const lp=hours.map((h,i)=>[x(i), base-((h.light||0)/100)*(base-70)]);
    const stops=hours.map((h,i)=>`<stop offset="${(i/(n-1)).toFixed(3)}" stop-color="${kRGB(h.k||2700)}"/>`).join("");
    light=`<defs><linearGradient id="lk" gradientUnits="userSpaceOnUse" x1="0" x2="${W}" y1="0" y2="0">${stops}</linearGradient></defs>
      <path d="${smooth(lp)}L${W} ${base}L0 ${base}Z" fill="url(#lk)" opacity=".22"/>
      <path d="${smooth(lp)}" fill="none" stroke="url(#lk)" stroke-width="3" opacity=".95"/>`;
  }
  // the sky line: the sun's height while it's up, the moon's while it's up and the sun isn't,
  // one dotted line on a fixed 0–75° scale so the seasons read true
  const sy=e=>base-Math.max(0,e)/75*(base-40);
  const body=hours.map(h=>h.sun!=null&&h.sun>-1?["sun",h.sun]:h.moon!=null&&h.moon>0?["moon",h.moon]:null);
  let sun="", run=[], kind=null;
  const flush=()=>{ if(run.length>1) sun+=`<path d="${smooth(run)}" fill="none" stroke="${kind==="sun"?"var(--sun)":"var(--moonline)"}" stroke-width="3" stroke-dasharray="0.5 9" stroke-linecap="round"/>`; run=[]; };
  body.forEach((b,i)=>{ if(!b || b[0]!==kind){ flush(); kind=b?b[0]:null; } if(b) run.push([x(i),sy(b[1])]); });
  flush();
  let sunNow="";
  if (body[nowIdx] && body[nowIdx][0]==="sun") sunNow=`<circle cx="${x(nowIdx)}" cy="${sy(body[nowIdx][1])}" r="30" fill="var(--sun)" opacity=".25"/><circle cx="${x(nowIdx)}" cy="${sy(body[nowIdx][1])}" r="13" fill="var(--sun)"/>`;
  // the moon, drawn at its highest point on the line (or where it is now, after dark)
  const mi = body[nowIdx]&&body[nowIdx][0]==="moon" ? nowIdx : body.reduce((m,b,i)=>b&&b[0]==="moon"&&(m<0||b[1]>body[m][1])?i:m,-1);
  if (mi>=0 && B_MOON) sunNow+=`<g transform="translate(${(x(mi)-17).toFixed(1)} ${(sy(body[mi][1])-17).toFixed(1)}) scale(1.13)">${moonSvg(B_MOON.f).replace(/<\/?svg[^>]*>/g,"")}</g>`;
  // rain: ticks along the foot
  const bw=W/n*.5;
  const bars=hours.map((h,i)=>h.p>=10?`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(H-h.p/100*30).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h.p/100*30).toFixed(1)}" rx="2" fill="var(--ink)" opacity="${(.2+h.p/100*.5).toFixed(2)}"/>`:"").join("");
  const hiI=ts.indexOf(Math.max(...ts)), lab=(i,txt,dy)=>`<text x="${x(i)}" y="${y(hours[i].t)+dy}" text-anchor="middle" font-size="30" font-weight="520" fill="var(--ink)">${txt}</text>`;
  const [nx,ny]=pts[nowIdx];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${light}${sun}${bars}
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--hair)" stroke-width="1.5"/>
    <path d="${smooth(pts)}" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
    ${lab(hiI,hours[hiI].t+"°",-22)}
    ${hiI!==nowIdx?`<text x="${x(nowIdx)}" y="${y(hours[nowIdx].t)-38}" text-anchor="${nowIdx===0?"start":"middle"}" font-size="30" font-weight="520" fill="var(--ink)">${hours[nowIdx].t}°</text>`:""}
    ${hiI!==n-1?`<text x="${W}" y="${y(hours[n-1].t)-22}" text-anchor="end" font-size="30" font-weight="440" fill="var(--ink)" opacity=".55">${hours[n-1].t}°</text>`:""}
    <line x1="${nx}" x2="${nx}" y1="${ny}" y2="${H}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 6"/>
    ${sunNow}
    <circle cx="${nx}" cy="${ny}" r="24" fill="var(--glow)" opacity=".35"/><circle cx="${nx}" cy="${ny}" r="10" fill="var(--ink)"/>
  </svg>`;
}

/* After dark with no night photo yet: the day's sky, dimmed and cooled, with light type */
const DIM = {ink:"light", veil:"linear-gradient(180deg,rgb(6 10 20 / .35),rgb(6 10 20 / .25) 45%,rgb(6 10 20 / .6))"};
/* The moon as it looks: lit limb on the right while waxing, left while waning; the terminator is an ellipse */
function moonSvg(f){
  const r=13, k=Math.cos(2*Math.PI*f), waxing=f<.5, lit=(1-k)/2;
  const rx=Math.abs(k*r).toFixed(2), outer=waxing?1:0, inner=(k>0)===waxing?0:1;
  const d=`M15 2 A${r} ${r} 0 0 ${outer} 15 28 A${rx} ${r} 0 0 ${inner} 15 2Z`;
  return `<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="${r}" fill="var(--ink)" opacity=".18"/>${lit>.02?`<path d="${d}" fill="var(--ink)"/>`:""}<circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--ink)" stroke-width="1.2" opacity=".6"/></svg>`;
}
let B_MOON=null;
function render(B){
  B_MOON=B.moon;
  const s = B.dim ? DIM : (SKY[B.sky] || SKY.overcast);
  document.getElementById("sky").style.filter = B.dim ? "brightness(.38) saturate(.55) hue-rotate(12deg)" : "";
  document.documentElement.dataset.ink = s.ink;
  document.getElementById("sky").style.backgroundImage = `url("${B.image}")`;
  document.getElementById("veil").style.background = s.veil;
  const n = B.hours.length, step = n > 12 ? 3 : 2;
  const axis = B.hours.map((h,i)=>i%step===0 && (n-1-i >= step/2 || i===0) ? `<span style="left:${(i/(n-1)*100).toFixed(2)}%">${esc(h.h)}</span>` : "").join("");
  document.getElementById("page").innerHTML = `
    <header class="mast"><span><b>${esc(B.day)}</b> &nbsp;${esc(B.date)}</span><span>${esc(B.place)} · ${esc(B.asof)}</span></header>
    <section class="now">
      <div class="temp">${B.temp}<sup>°</sup></div>
      <div class="hl"><span><i>H</i>${B.high}°</span><span><i>L</i>${B.low}°</span>${B.humidity!=null?`<span><i>RH</i>${B.humidity}%</span>`:""}${B.pollen&&B.pollen.rating?`<span><i>Pollen</i>${esc(B.pollen.rating.toLowerCase())}</span>`:""}</div>
    </section>
    <h1 class="say">${esc(B.say)}</h1>
    <ul class="notes">${B.notes.map(n=>`<li><div><b>${esc(n.what)}</b>${n.when?` <span>${esc(n.when)}</span>`:""}</div></li>`).join("")}</ul>
    <section class="days"><h2>Next three days</h2><div class="cols">${B.days.map(d=>`
      <div class="col"><h3>${esc(d.name)}</h3><img alt="" src="wx/${esc(d.icon)}.svg">
        <div class="t">${d.hi}°<span>${d.lo}°</span></div><p>${d.note}</p></div>`).join("")}</div></section>
    <section class="today"><h2 class="th"><span>${esc(B.label || "Today")}</span>${B.moon?`<span class="moon">${moonSvg(B.moon.f)}${esc(B.moon.name)} · ${B.moon.pct}%</span>`:""}</h2>${chart(B.hours, B.nowIdx)}<div class="axis">${axis}</div>
      <div class="key"><span><i class="kt"></i>Outside</span><span><i class="ks"></i>Sun and moon</span><span><i class="kl"></i>The house's light</span><span><i class="kr"></i>Chance of rain</span></div></section>
    ${B.inside?`<section class="inside"><h2>Inside</h2><div class="in">
      ${B.inside.t!=null?`<div class="n">${B.inside.t}°</div>`:""}${B.inside.rh!=null?`<div class="n q">${B.inside.rh}<small>%</small></div>`:""}
      <div class="in-notes">${B.inside.notes.map(x=>`<span>${x}</span>`).join("")}</div></div></section>`:""}`;
}
if (window.BOARD) render(window.BOARD);
else fetch("api/board").then(r=>r.json()).then(render);
</script>
</body>
</html>
