<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>House</title>
<link rel="stylesheet" href="shared/tokens.css?v=5e0e7a89">
<script src="shared/appnav.js?v=5e0e7a89"></script>
<style>

main{max-width:calc(var(--maxw) + 2*var(--gut));margin:0 auto;padding:clamp(12px,1.8vw,22px) var(--gut) 0}
body{padding:env(safe-area-inset-top) 0 calc(var(--gut)*2)}

/* Top bar: the shared app bar, with this app's views as tabs */

button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Masthead: the facts of the day in one quiet line */
.mast{display:flex;flex-wrap:wrap;gap:.25em 1.6em;font-stretch:82%;font-size:var(--s-1);color:var(--quiet);letter-spacing:.01em}
.mast b{font-weight:500;color:var(--ink)}

/* Hero: the state of the light, as a sentence */
.say{margin:.45em 0 .5em;font-size:var(--s5);line-height:1.02;font-weight:290;font-stretch:96%;letter-spacing:-.022em;max-width:17ch}
.say .n{font-weight:520;font-stretch:122%;letter-spacing:-.035em}
.say .k{font-stretch:122%;font-weight:520;letter-spacing:-.035em}
.say small{display:block;margin-top:.45em;font-size:var(--s1);line-height:1.3;font-weight:380;font-stretch:88%;letter-spacing:0;color:var(--quiet);max-width:38ch}

/* The day, drawn */
.day{position:relative;margin:clamp(20px,3vw,36px) 0 0;touch-action:pan-y;cursor:crosshair}
.day svg{display:block;width:100%;height:clamp(190px,28vw,300px);overflow:visible}
.sundot{position:absolute;left:0;right:0;top:0;height:clamp(190px,28vw,300px);pointer-events:none;z-index:1}
.sundot i{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#FFD27A;box-shadow:0 0 0 1.5px var(--ink),0 0 14px 4px rgba(255,200,90,.45)}
.sunmarks{position:absolute;inset:0 0 auto 0;height:0;z-index:1;pointer-events:none}
.sm{position:absolute;top:8px;display:flex;align-items:center;gap:.4em;white-space:nowrap;font-size:var(--s-1);font-stretch:84%;color:var(--quiet);background:var(--ground);padding:.15em .4em}
.sm b{font-weight:500;color:var(--ink);font-stretch:90%}
.sm i{font-style:normal}
.sm svg{width:20px;height:15px;color:var(--ink);flex:none}
.sm.rise{margin-left:4px}
.sm.set{margin-right:4px}
.moon{display:inline-flex;align-items:center;gap:.45em}
.moon svg{width:15px;height:15px;vertical-align:-2px}
@media (max-width:520px){.sm i{display:none}}
.axis{display:flex;justify-content:space-between;font-stretch:78%;font-size:var(--s-1);color:var(--quiet);margin-top:.5em}
.axis span:nth-child(odd){visibility:visible}
.legend{display:flex;flex-wrap:wrap;gap:.3em 1.4em;margin-top:.9em;font-size:var(--s-1);font-stretch:82%;color:var(--quiet)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;border-image:linear-gradient(90deg,#ffb46b,#fff1e0,#dfe8ff) 1;vertical-align:.3em;margin-right:.45em}
.legend i.base{border-top:1px dashed var(--quiet);border-image:none}
.legend i.sunl{border-top:2px dotted #FFD27A;border-image:none}
.legend i.sw{height:9px;border:0;background:linear-gradient(90deg,#ffb46b,#fff1e0,#dfe8ff);vertical-align:0}

/* Lower field */
.field{display:grid;gap:clamp(36px,5vw,64px) clamp(28px,4vw,56px);margin-top:clamp(44px,6vw,80px);grid-template-columns:1fr}
@media (min-width:760px){.field{grid-template-columns:1fr 1fr}}
@media (min-width:1080px){.field{grid-template-columns:1fr 1fr}}
h2{font-size:var(--s0);font-weight:600;font-stretch:88%;margin:0 0 .9em;letter-spacing:-.005em}
h2 span{font-weight:400;color:var(--quiet);margin-left:.5em}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{appearance:none;border:1px solid var(--hair);background:transparent;border-radius:3px;text-align:left;padding:.85em .9em .8em;min-height:82px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:.4em;transition:border-color .2s,background-color .25s}
.act:hover{border-color:var(--ink)}
.act strong{font-weight:540;font-stretch:96%;font-size:var(--s1);line-height:1.1;letter-spacing:-.01em}
.act em{font-style:normal;font-size:var(--s-1);font-stretch:84%;color:var(--quiet)}
.act[aria-pressed="true"]{background:var(--light);border-color:var(--light);color:#1B2124}
.act[aria-pressed="true"] em{color:#1B2124;opacity:.72}
.act.busy{opacity:.55}

dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:.55em 1.2em}
dt{font-stretch:96%}
dd{margin:0;text-align:right;font-stretch:84%;color:var(--quiet);white-space:nowrap}
dd.live{color:var(--ink)}
dd.live::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--light);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 25%,transparent);margin-right:.5em;vertical-align:.08em}
dd.gone{color:var(--quiet);opacity:.6}
.sub{margin-top:2.2em}

ol.log{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto 1fr;gap:.5em 1.1em}
ol.log li{display:contents}
ol.log time{font-stretch:78%;color:var(--quiet);text-align:right;font-size:var(--s-1);padding-top:.12em}
ol.log .day-break{grid-column:1/-1;font-stretch:84%;font-size:var(--s-1);color:var(--quiet);margin-top:.8em}
.shade{display:flex;justify-content:flex-end}
.shade span.seg3{display:inline-flex;border:1px solid var(--hair);border-radius:var(--r-pill);overflow:hidden}
.shade button{appearance:none;border:0;background:none;min-height:36px;padding:0 .95em;font-stretch:86%;font-size:var(--s-1);color:var(--ink);cursor:pointer}
.shade button + button{border-left:1px solid var(--hair)}
.shade button:hover{background:var(--well)}
#dshades{align-items:center;row-gap:.5em}
.err{color:var(--quiet);font-stretch:88%}
.more{appearance:none;border:0;background:none;padding:0;margin-top:1.3em;cursor:pointer;color:var(--ink);font-stretch:90%;
  text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:4px}
.more:hover{text-decoration-color:var(--ink)}
.page-h{font-size:var(--s3);font-weight:300;font-stretch:104%;letter-spacing:-.02em;line-height:1.05;margin:.3em 0 1.1em}
ol.log.big{font-size:var(--s1);gap:.65em 1.4em;max-width:46rem}
ol.log.big time{font-size:var(--s0)}

/* Devices: floors, then rooms, then each light */
.dev-shades{max-width:46rem;margin-bottom:clamp(36px,5vw,56px)}
/* Jump bar: floors, what's on, pins. Sticks under the app bar. */
.jump{position:sticky;top:52px;z-index:10;background:var(--ground);display:flex;gap:.4em 1.3em;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;margin:0 calc(-1*var(--gut)) clamp(22px,3vw,34px);padding:.75em var(--gut) .7em;border-bottom:1px solid var(--hair);white-space:nowrap}
.jump::-webkit-scrollbar{display:none}
.jump button{appearance:none;border:0;background:none;padding:.15em 0;cursor:pointer;color:var(--quiet);font-stretch:88%;font-size:var(--s-1)}
.jump button:hover{color:var(--ink)}
.jump button[aria-pressed="true"]{color:var(--ink);font-weight:560}
.jump .div{width:1px;align-self:stretch;background:var(--hair)}
.floor{scroll-margin-top:110px}
.pinned{margin-bottom:2.2em}
.pinned .dev:first-child{border-top:0}
.pinned .empty{color:var(--quiet);font-stretch:88%;margin:0}
.pinned .empty button{appearance:none;border:0;background:none;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:4px;font:inherit}
.floor{margin-bottom:clamp(40px,6vw,72px)}
.floor > h2{font-size:var(--s3);font-weight:300;font-stretch:104%;letter-spacing:-.02em;line-height:1.05;margin:0 0 .6em}
.floor > h2 span{font-size:var(--s0);font-weight:400;font-stretch:86%;letter-spacing:0}
.rooms{display:grid;gap:clamp(26px,3.5vw,40px) clamp(28px,4vw,56px);grid-template-columns:1fr}
@media (min-width:760px){.rooms{grid-template-columns:1fr 1fr}}
@media (min-width:1080px){.rooms{grid-template-columns:1fr 1fr 1fr}}
.room h3{font-size:var(--s0);font-weight:600;font-stretch:88%;margin:0 0 .5em;display:flex;justify-content:space-between;gap:1em}
.room h3 span{font-weight:400;color:var(--quiet)}
.dev{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n t" "s s";align-items:center;gap:.15em .8em;padding:.55em 0;border-top:1px solid var(--hair)}
.dev .n{grid-area:n;font-stretch:96%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev .n small{color:var(--quiet);font-stretch:82%;font-size:var(--s-1);margin-left:.5em}
.dev .tg{grid-area:t}
.dev input{grid-area:s}
.dev.unav .n,.dev.unav .tg{opacity:.45}
.act-field{margin-top:0}
@media (min-width:1080px){.act-field{grid-template-columns:1fr 2fr}}
ol.log.big{font-size:var(--s0)}

/* Counts are pills: a number in a soft capsule */
.count{display:inline-block;min-width:1.7em;padding:.05em .5em .1em;border-radius:var(--r-pill);background:var(--well);color:var(--ink);
  font-size:var(--s-1);font-weight:500;font-stretch:88%;text-align:center;line-height:1.35;vertical-align:.12em;margin-left:.45em}
[aria-pressed="true"] > .count{background:var(--ink);color:var(--ground)}
.floor > h2 .count{font-size:var(--s-1);vertical-align:.5em;letter-spacing:0}

/* Pin: an icon button on every device */
.dev{grid-template-columns:1fr auto auto;grid-template-areas:"n p t" "s s s"}
.pinb{grid-area:p;appearance:none;border:0;background:none;cursor:pointer;width:36px;height:32px;display:grid;place-items:center;color:var(--hair);border-radius:var(--r-s)}
.pinb:hover{color:var(--quiet)}
.pinb svg{width:17px;height:17px}
.pinb[aria-pressed="true"]{color:var(--ink)}
.pinb[aria-pressed="true"] path{fill:currentColor}

/* Shortcuts that need a second tap */
.act.guard{border-color:color-mix(in srgb,var(--alert) 55%,var(--hair))}
.act.guard strong{color:var(--alert)}
.act.armed{background:var(--alert);border-color:var(--alert);color:var(--ground)}
.act.armed strong,.act.armed em{color:var(--ground)}

/* Daylight meters: lux on a log scale, with the off and back-on thresholds */
.zone{margin-bottom:1.6em}
.zone .zh{display:flex;justify-content:space-between;gap:1em;align-items:baseline}
.zone .zh b{font-weight:500;font-stretch:96%}
.zone .zh span{font-stretch:86%;color:var(--quiet);font-size:var(--s-1)}
.meter{position:relative;height:16px;margin:.55em 0 1.5em;background:linear-gradient(var(--hair),var(--hair)) 0 50%/100% 2px no-repeat}
.meter i{position:absolute;display:block;font-style:normal}
.meter .band{top:3px;height:10px;background:var(--well);box-shadow:inset 0 0 0 1px var(--hair)}
.meter .tk{top:0;width:1px;height:16px;background:var(--quiet)}
.meter .tk span{position:absolute;top:19px;left:50%;transform:translateX(-50%);font-size:11.5px;font-stretch:80%;color:var(--quiet);white-space:nowrap}
.meter .dot{top:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ground);box-shadow:inset 0 0 0 1.5px var(--ink)}
.meter .dot.lit{background:var(--light)}
.zone p{margin:0;font-size:var(--s-1);font-stretch:88%;color:var(--quiet);max-width:44ch}
.zone p b{color:var(--ink);font-weight:500}

/* Listen: the week's records, set like a magazine page */
.lk{font-size:var(--s-1);font-stretch:82%;color:var(--quiet);letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:.3em 1.4em}
.lk b{color:var(--ink);font-weight:500}
.lh{margin:.35em 0 .2em;font-size:var(--s5);line-height:1.02;font-weight:290;font-stretch:96%;letter-spacing:-.022em}
.lh em{font-style:normal;font-weight:520;font-stretch:122%;letter-spacing:-.035em}
.lbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:clamp(18px,2.4vw,28px) 0 clamp(22px,3vw,36px)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:var(--r-pill);overflow:hidden}
.seg button{appearance:none;border:0;background:none;padding:.42em .95em .46em;font-size:var(--s-1);font-stretch:86%;color:var(--quiet);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.lbar .t-quiet{margin-right:-6px}
.recs{display:grid;gap:clamp(34px,4vw,56px) clamp(22px,3vw,40px);grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.rec{display:flex;flex-direction:column;min-width:0}
.rec .art{position:relative;aspect-ratio:1;background:var(--well);border-radius:2px;overflow:hidden}
.rec .art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.rec:hover .art img{transform:scale(1.015)}
.rec .art .tag{position:absolute;left:10px;top:10px;background:var(--ground);color:var(--ink);font-size:11.5px;font-stretch:84%;letter-spacing:.06em;text-transform:uppercase;padding:.3em .6em .32em;border-radius:2px}
.rec .label{margin:14px 0 6px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-stretch:118%;font-weight:560;color:var(--quiet);
  display:flex;justify-content:space-between;gap:1em}
.rec .label span:last-child{letter-spacing:.04em;font-stretch:84%;font-weight:400;text-transform:none}
.rec h3{margin:0;font-size:var(--s3);line-height:1.02;font-weight:560;font-stretch:118%;letter-spacing:-.03em;overflow-wrap:anywhere}
.rec .al{margin:.18em 0 0;font-size:var(--s1);font-weight:330;font-stretch:96%;letter-spacing:-.01em;line-height:1.2}
.rec .why{margin:.75em 0 0;color:var(--quiet);line-height:1.45;max-width:46ch}
.rec .src{margin:.5em 0 0;font-size:var(--s-1);font-stretch:84%;color:var(--quiet)}
.rec .src a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
.rec .row{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:16px}
.rec .row .grow{flex:1}
.ib{appearance:none;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--hair);border-radius:50%;background:none;cursor:pointer;color:var(--quiet)}
.ib svg{width:17px;height:17px}
.ib:hover{color:var(--ink);border-color:var(--ink)}
.ib[aria-pressed="true"]{background:var(--light);border-color:var(--light);color:var(--on-light)}
.rec .play{display:inline-flex;align-items:center;gap:.5em}
.rec .play svg{width:12px;height:12px}
.rec .play.busy{opacity:.5}
.rec .sp{font-size:var(--s-1);font-stretch:86%;color:var(--quiet);text-decoration:none;white-space:nowrap}
.rec .sp:hover{color:var(--ink)}
.rec.liked .art{box-shadow:0 0 0 2px var(--light)}
.rec.passed{opacity:.55}
.lfoot{margin-top:clamp(40px,5vw,64px);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;color:var(--quiet);font-size:var(--s-1);font-stretch:86%}
.lwait{color:var(--quiet);font-stretch:88%}
.lwait b{color:var(--ink);font-weight:500}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<app-bar app="house"><nav slot="tabs" class="app-tabs" role="tablist" aria-label="House">
  <button role="tab" data-v="now" aria-selected="true">Now</button>
  <button role="tab" data-v="devices" aria-selected="false">Devices</button>
  <button role="tab" data-v="listen" aria-selected="false">Listen</button>
  <button role="tab" data-v="activity" aria-selected="false">Activity</button>
</nav></app-bar>
<main>
<section id="v-now" role="tabpanel" aria-label="Now">
  <header class="mast" id="mast"></header>
  <h1 class="say" id="say" aria-live="polite">Reading the house</h1>
  <figure class="day" id="day" aria-label="Today's light, brightness over the day, coloured by colour temperature">
    <div class="sunmarks" id="sunmarks" aria-hidden="true"></div>
    <div class="sundot" id="sundot" aria-hidden="true"></div>
    <svg id="g" viewBox="0 0 1000 300" preserveAspectRatio="none" role="img"></svg>
    <div class="axis" aria-hidden="true"><span>Midnight</span><span>3</span><span>6 am</span><span>9</span><span>Noon</span><span>3</span><span>6 pm</span><span>9</span><span>Midnight</span></div>
    <figcaption class="legend" id="legend"></figcaption>
  </figure>
  <section class="field">
    <div>
      <h2>Shortcuts</h2>
      <div class="acts" id="acts"></div>
      <div class="pinned sub" id="pinned-wrap"><h2>Pinned</h2><div id="pinned"></div></div>
    </div>
    <div>
      <h2>Daylight</h2>
      <div id="daylight"></div>
      <div class="sub"><h2>Light right now</h2><dl id="status"></dl></div>
    </div>
  </section>
</section>
<section id="v-devices" role="tabpanel" aria-label="Devices" hidden>
  <nav class="jump" id="jump" aria-label="Find a device"></nav>
  <div class="dev-shades"><h2>Curtains and shades</h2><dl id="dshades"></dl></div>
  <div id="floors"><p class="err">Finding the rooms.</p></div>
</section>
<section id="v-listen" role="tabpanel" aria-label="Listen" hidden>
  <header class="lk" id="lk"></header>
  <h1 class="lh" id="lh">Records for the week</h1>
  <div class="lbar" id="lbar"></div>
  <div class="recs" id="recs"></div>
  <footer class="lfoot" id="lfoot"></footer>
</section>
<section id="v-activity" role="tabpanel" aria-label="Activity" hidden>
  <div class="field act-field">
    <div><h2>Motion</h2><dl id="motion"></dl></div>
    <div><h2>The last day in the house</h2><ol class="log big" id="alog"></ol></div>
  </div>
</section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const API = new URLSearchParams(location.search).has("mock") ? "mock_state.json" : "api/state";
let S = null, scrub = null, armedFor = null, armTimer = null;

/* Colour temperature to sRGB (Tanner Helland's fit), for drawing the light as it looks. */
function kRGB(k){
  const t = k/100; let r,g,b;
  if (t <= 66){ r = 255; g = 99.4708025861*Math.log(t)-161.1195681661; }
  else { r = 329.698727446*Math.pow(t-60,-0.1332047592); g = 288.1221695283*Math.pow(t-60,-0.0755148492); }
  b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231*Math.log(t-10)-305.0447927307;
  const c = v => Math.max(0,Math.min(255,Math.round(v)));
  return [c(r),c(g),c(b)];
}
const css = ([r,g,b],a=1) => a===1 ? `rgb(${r} ${g} ${b})` : `rgb(${r} ${g} ${b} / ${a})`;

const tf = new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"});
const t = s => tf.format(new Date(s)).replace(/\s?([AP])M/i,(m,p)=>" "+p.toLowerCase()+"m");
function ago(s){
  const m = Math.round((Date.now()-new Date(s))/60000);
  if (m < 1) return "just now"; if (m < 60) return m+" min ago";
  const h = Math.round(m/60); if (h < 24) return h+" h ago";
  return Math.round(h/24)+" d ago";
}
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* The house curve: average level of the main-floor lights that have one, and their median colour. */
function houseCurve(day, boosted){
  const ids = day.boost.lights.length ? day.boost.lights : Object.keys(day.lights);
  const n = day.lights[ids[0]]?.curve.length || 145, out = [];
  for (let i=0;i<n;i++){
    let sum=0, c=0; const ks=[];
    for (const e of ids){ const p = day.lights[e]?.curve[i]; if (p){ sum+=p[0]; c++; if (p[1]) ks.push(p[1]); } }
    let b = c ? sum/c : 0;
    const m = boosted && day.boost.on && day.boost.mult ? day.boost.mult[i] : null;
    if (m) b = Math.min(100,b*m);
    ks.sort((a,b)=>a-b);
    out.push({b, k: ks.length ? ks[ks.length>>1] : 2700, lit: c});
  }
  return out;
}

function draw(){
  const d = S.circadian, g = $("g");
  if (!d){ g.innerHTML=""; return; }
  const W=1000,H=300,top=58,bot=288;   // the top band is the sun lane
  const d0 = new Date(d.day_start), span = 24*3600e3;
  const X = s => (new Date(s)-d0)/span*W;
  const base = houseCurve(d,false), eff = houseCurve(d,true);
  const n = eff.length, xi = i => i/(n-1)*W, yv = b => bot-(b/100)*(bot-top);
  const night = `<rect x="0" y="0" width="${X(d.sunrise).toFixed(1)}" height="${H}" fill="var(--well)"/><rect x="${X(d.sunset).toFixed(1)}" y="0" width="${(W-X(d.sunset)).toFixed(1)}" height="${H}" fill="var(--well)"/>`;
  const stops = eff.map((p,i)=>`<stop offset="${(i/(n-1)).toFixed(4)}" stop-color="${css(kRGB(p.k))}"/>`).join("");
  const line = arr => arr.map((p,i)=>`${i?"L":"M"}${xi(i).toFixed(1)} ${yv(p.b).toFixed(1)}`).join("");

/* Solar elevation in degrees (NOAA's approximation; good to a fraction of a degree). */
function sunElev(date, lat, lon){
  const rad = Math.PI/180, jd = date.getTime()/864e5 + 2440587.5, T = (jd-2451545)/36525;
  const L0 = (280.46646 + T*(36000.76983 + T*0.0003032)) % 360, M = 357.52911 + T*(35999.05029 - 0.0001537*T);
  const C = Math.sin(M*rad)*(1.914602 - T*(0.004817+0.000014*T)) + Math.sin(2*M*rad)*(0.019993-0.000101*T) + Math.sin(3*M*rad)*0.000289;
  const lam = L0 + C - 0.00569 - 0.00478*Math.sin((125.04-1934.136*T)*rad);
  const eps = 23 + (26 + (21.448 - T*(46.815 + T*(0.00059 - T*0.001813)))/60)/60 + 0.00256*Math.cos((125.04-1934.136*T)*rad);
  const dec = Math.asin(Math.sin(eps*rad)*Math.sin(lam*rad));
  const y = Math.tan(eps*rad/2)**2, e = 0.016708634 - T*(0.000042037+0.0000001267*T);
  const eqt = 4/rad*(y*Math.sin(2*L0*rad) - 2*e*Math.sin(M*rad) + 4*e*y*Math.sin(M*rad)*Math.cos(2*L0*rad) - .5*y*y*Math.sin(4*L0*rad) - 1.25*e*e*Math.sin(2*M*rad));
  const mins = date.getUTCHours()*60 + date.getUTCMinutes() + date.getUTCSeconds()/60;
  const ha = ((mins + eqt + 4*lon)/4 - 180)*rad;
  return Math.asin(Math.sin(lat*rad)*Math.sin(dec) + Math.cos(lat*rad)*Math.cos(dec)*Math.cos(ha))/rad;
}
/* Moon phase from the mean synodic month, counted from the new moon of 6 Jan 2000 18:14 UTC. */
function moon(date){
  const syn = 29.530588853, age = (((date - Date.UTC(2000,0,6,18,14))/864e5) % syn + syn) % syn, f = age/syn;
  const lit = (1 - Math.cos(2*Math.PI*f))/2;
  const name = age < 1.0 || age > syn-1.0 ? "New moon" : Math.abs(age - syn/2) < 1.0 ? "Full moon" :
    Math.abs(age - syn/4) < 1.0 ? "First quarter" : Math.abs(age - 3*syn/4) < 1.0 ? "Last quarter" :
    f < .25 ? "Waxing crescent" : f < .5 ? "Waxing gibbous" : f < .75 ? "Waning gibbous" : "Waning crescent";
  // Draw: lit limb on the right while waxing, left while waning; the terminator is an ellipse.
  const r = 6.5, k = Math.cos(2*Math.PI*f), waxing = f < .5;
  const sweepOuter = waxing ? 1 : 0, rx = Math.abs(k*r), sweepInner = (k > 0) === waxing ? 0 : 1;
  const d = `M7.5 1 A${r} ${r} 0 0 ${sweepOuter} 7.5 14 A${rx.toFixed(2)} ${r} 0 0 ${sweepInner} 7.5 1Z`;
  const svg = `<svg viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="${r}" fill="var(--quiet)"/>${lit>.02?`<path d="${d}" fill="#F6F1E4"/>`:""}<circle cx="7.5" cy="7.5" r="${r}" fill="none" stroke="var(--ink)" stroke-width=".9"/></svg>`;
  return {name, pct: Math.round(lit*100), svg};
}
/* Sun on the horizon, with which way it's going */
const SUN_UP = `<svg viewBox="0 0 22 16" aria-hidden="true"><path d="M3 13.5h16M6.5 13.5a4.5 4.5 0 0 1 9 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M11 6.5V1.6M8.6 3.8 11 1.4l2.4 2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function hero(eff, si, nowI){
  const d = S.circadian, p = eff[si];
  const k = Math.round(p.k/10)*10, b = Math.round(p.b);
  let lead, sub = "";
  if (scrub != null && si !== nowI){
    const when = new Date(new Date(d.day_start).getTime()+si*d.step_minutes*60e3);
    lead = `At ${esc(t(when))}, <span class="n">${b}%</span> at <span class="k">${k.toLocaleString()} K</span>`;
    sub = p.lit ? `${p.lit} of ${d.boost.lights.length || Object.keys(d.lights).length} main-floor lights on the schedule then.` : "Nothing on the schedule then.";
  } else {
    lead = `The house is at <span class="n">${b}%</span>, <span class="k">${k.toLocaleString()} K</span>`;
    if (d.boost.on) sub = new Date(d.now) < new Date(d.boost.ease_from)
      ? `Bright House is on. It eases back from ${t(d.boost.ease_from)} and settles into the evening by ${t(d.boost.ease_to)}.`
      : `Bright House is easing back, settled by ${t(d.boost.ease_to)}.`;
    else {
      const next = d.keyframes.find(x=>new Date(x.at)>new Date(d.now));
      sub = next ? `Following the day. Next change at ${t(next.at)}.` : "Following the day.";
    }
    if (!d.enabled) sub = "Circadian is paused. Lights stay where people put them.";
    document.documentElement.style.setProperty("--light", css(kRGB(p.k)));

  $("say").innerHTML = `${lead}.<small>${esc(sub)}</small>`;
}

/* One daylight zone: where the sensor reads against the two thresholds, and what it's doing. */
const ZONE = {kitchen:"Kitchen and dining", outdoor:"Outside, south corner"};
function zoneMeter(z, lights){
  const lux = z.lux, lo = Math.max(1, z.on_below/20), hi = z.off_above*12;
  const W = 1000, x = v => Math.max(0, Math.min(W, Math.log(Math.max(v,lo)/lo)/Math.log(hi/lo)*W));

  let say;
  if (lux == null) say = `No reading from the sensor, so it counts as dark: lights follow the schedule.`;
  else if (z.bright) say = off.length
    ? `<b>Bright enough.</b> Holding ${off.length} light${off.length>1?"s":""} off: ${off.map(l=>esc(l.name)).join(", ")}. They come back below ${fmt(z.on_below)} lx.`
    : `<b>Bright enough.</b> Nothing it manages is on, so nothing to switch off.`;
  else if (lux >= z.on_below) say = `<b>In between.</b> Lights stay as they are until it's above ${fmt(z.off_above)} lx for a while.`;
  else say = `<b>Not bright enough</b> to switch anything off. That starts above ${fmt(z.off_above)} lx.`;
  const pc = v => (x(v)/W*100).toFixed(2)+"%";
  return `<div class="zone"><div class="zh"><b>${esc(ZONE[z.name]||z.name)}</b><span>${lux==null?"no reading":fmt(lux)+" lx"}</span></div>
    <div class="meter" role="img" aria-label="${lux==null?"No reading":fmt(lux)+" lux"}; lights go off above ${fmt(z.off_above)}, back on below ${fmt(z.on_below)}">
      <i class="band" style="left:${pc(z.on_below)};width:calc(${pc(z.off_above)} - ${pc(z.on_below)})"></i>
      <i class="tk" style="left:${pc(z.on_below)}"><span>${fmt(z.on_below)}</span></i><i class="tk" style="left:${pc(z.off_above)}"><span>${fmt(z.off_above)}</span></i>
      ${lux==null?"":`<i class="dot${z.bright?" lit":""}" style="left:${pc(lux)}"></i>`}
    </div>
    <p>${say}</p></div>`;
}

function shadeRows(list){
  return list.map(c=>{
    const st = c.state==="unknown" || c.state==null ? "" : (c.position!=null && c.state==="open" && c.position<100 ? `${c.position}% open` : c.state);
    return `<dt>${esc(c.name)} <span style="color:var(--quiet);font-stretch:84%">${esc(st)}</span></dt><dd class="shade"><span class="seg3"><button data-c="${esc(c.entity)}" data-op="open">Open</button><button data-c="${esc(c.entity)}" data-op="stop">Stop</button><button data-c="${esc(c.entity)}" data-op="close">Close</button></span></dd>`;
  }).join("");
}

function logRows(list){

  if (e.target.closest("[data-filter]")){ onlyOn = !onlyOn; renderDevices(); return; }
  const fl = e.target.closest("[data-floor]");
  if (fl){ if (onlyOn){ onlyOn=false; renderDevices(); } $("floor-"+fl.dataset.floor)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const d = e.target.closest(".tg");
  if (d){ d.setAttribute("aria-pressed", d.getAttribute("aria-pressed")!=="true"); act({entity:d.dataset.d, op: d.getAttribute("aria-pressed")==="true"?"on":"off"}, d, loadDevices); return; }
  const b = e.target.closest(".act");
  if (b && b.hasAttribute("data-confirm") && armedFor !== b.dataset.e){
    armedFor = b.dataset.e; render(); clearTimeout(armTimer);
    armTimer = setTimeout(()=>{ armedFor = null; render(); }, 4000); return;
  }
  if (b){ armedFor = null; const tog = b.hasAttribute("aria-pressed"); act({entity:b.dataset.e, op: tog ? (b.getAttribute("aria-pressed")==="true"?"off":"on") : "run"}, b); return; }
  const c = e.target.closest("[data-c]");
  if (c) act({entity:c.dataset.c, op:c.dataset.op}, c);
});

/* Listen */
let L = null, place = "main", listenTimer = null;
try{ place = localStorage.getItem("house-place") || "main"; }catch(e){}
const ICON = {
  up:`<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M6 8.2 8.8 2.6c1 0 1.7.8 1.6 1.8l-.3 2.6h3.6c.9 0 1.6.9 1.4 1.8l-1.1 5c-.2.7-.8 1.2-1.5 1.2H6m0-6.8v6.8m0-6.8H3.4v6.8H6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  down:`<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M12 9.8 9.2 15.4c-1 0-1.7-.8-1.6-1.8l.3-2.6H4.3c-.9 0-1.6-.9-1.4-1.8l1.1-5c.2-.7.8-1.2 1.5-1.2H12m0 6.8V3m0 6.8h2.6V3H12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  x:`<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M5 5l8 8M13 5l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  play:`<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>`,
};
async function loadListen(){
  try{
    const r = await fetch("api/listen",{cache:"no-store"}); L = await r.json(); renderListen();
  }catch(e){ $("recs").innerHTML = `<p class="lwait">Couldn't reach the record shelf.</p>`; }
  clearTimeout(listenTimer);
  if (L && L.busy && view==="listen") listenTimer = setTimeout(loadListen, 5000);
}
function renderListen(){
  const picks = L.picks||[], nw = picks.filter(p=>p.kind==="new").length, sh = picks.length-nw;
  const when = L.generated ? new Date(L.generated) : null;
  $("lk").innerHTML = `<span><b>${esc(L.season||"This week")}</b></span>`+
    (picks.length?`<span><b>${nw}</b> new ${nw===1?"record":"records"}${sh?`, <b>${sh}</b> from your shelf`:""}</span>`:"")+
    (when?`<span>Picked ${when.toLocaleDateString(undefined,{weekday:"long"})} from this season's reviews</span>`:"");
  $("lh").innerHTML = picks.length ? `Records for <em>the week</em>` : `Nothing on the shelf <em>yet</em>`;
  $("lbar").innerHTML = `<span class="t-quiet">Play on</span><div class="seg" role="group" aria-label="Play on">${
    Object.entries(L.places||{}).map(([k,n])=>`<button data-place="${k}" aria-pressed="${k===place}">${esc(n)}</button>`).join("")}</div>`;
  $("recs").innerHTML = picks.map(p=>{
    const v = p.verdict, art = p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : "";
    return `<article class="rec ${v==="up"?"liked":v==="down"?"passed":""}">
      <div class="art">${art}${p.kind==="second"?`<span class="tag">Second listen</span>`:""}</div>
      <div class="label"><span>${esc(p.label||p.lane||"")}</span><span>${esc(p.released||"")}</span></div>
      <h3>${esc(p.artist)}</h3><p class="al">${esc(p.album)}</p>
      <p class="why">${esc(p.why)}</p>
      ${p.source?`<p class="src">${p.source_url?`<a href="${esc(p.source_url)}" target="_blank" rel="noopener">via ${esc(p.source)}</a>`:`via ${esc(p.source)}`}${p.lane&&p.label?` · ${esc(p.lane)}`:""}</p>`:""}
      <div class="row">
        <button class="btn small play" data-lplay="${p.id}">${ICON.play}Play</button>
        <a class="sp grow" href="${esc(p.spotify_url)}" target="_blank" rel="noopener">Spotify ↗</a>
        <button class="ib" data-lv="${p.id}" data-verdict="up" aria-label="More like this" aria-pressed="${v==="up"}">${ICON.up}</button>
        <button class="ib" data-lv="${p.id}" data-verdict="down" aria-label="Less like this" aria-pressed="${v==="down"}">${ICON.down}</button>
        <button class="ib" data-lv="${p.id}" data-verdict="dismiss" aria-label="Hide, no judgment">${ICON.x}</button>
      </div></article>`;
  }).join("");
  $("lfoot").innerHTML = L.busy
    ? `<span class="lwait"><b>Reading this season's reviews</b> and checking Spotify. A minute or two.</span>`
    : `<span>${L.error?esc(L.error)+" ":""}New picks arrive Friday mornings. Thumbs steer the next ones; × just hides a card.</span>
       <button class="btn ghost small" data-lrefresh>Pick again now</button>`;
}
async function listenPost(path, body){
  const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  if (!r.ok) throw new Error(r.status); return r.json();
}
document.addEventListener("click", async e=>{
  const pl = e.target.closest("[data-place]");
  if (pl){ place = pl.dataset.place; try{ localStorage.setItem("house-place", place); }catch(x){} renderListen(); return; }
  const lv = e.target.closest("[data-lv]");
  if (lv){ const p = L.picks.find(x=>x.id===lv.dataset.lv), want = lv.dataset.verdict;
    const verdict = (p && p.verdict===want && want!=="dismiss") ? null : want;
    try{ L = await listenPost("api/listen/feedback",{id:lv.dataset.lv, verdict}); renderListen(); }catch(x){} return; }
  const lp = e.target.closest("[data-lplay]");
  if (lp){ lp.classList.add("busy"); lp.lastChild.textContent = "Starting";
    try{ await listenPost("api/listen/play",{id:lp.dataset.lplay, place}); lp.lastChild.textContent = "Playing"; }
    catch(x){ lp.lastChild.textContent = "Didn't start"; }
    setTimeout(()=>{ lp.classList.remove("busy"); lp.lastChild.textContent = "Play"; }, 4000); return; }
  if (e.target.closest("[data-lrefresh]")){ try{ L = await listenPost("api/listen/refresh"); renderListen(); loadListen(); }catch(x){} }
});

/* Scrub the day: point or drag across the graph to read any moment. */
const fig = $("day");
function scrubAt(ev){
  const r = $("g").getBoundingClientRect();
  scrub = Math.max(0,Math.min(1000,(ev.clientX-r.left)/r.width*1000)); if (S) draw();
}
fig.addEventListener("pointermove",scrubAt);
fig.addEventListener("pointerdown",scrubAt);
fig.addEventListener("pointerleave",()=>{ scrub=null; if (S) draw(); });
fig.addEventListener("pointerup",ev=>{ if (ev.pointerType!=="mouse"){ setTimeout(()=>{scrub=null; if (S) draw();},1600); } });
fig.addEventListener("pointercancel",()=>{ scrub=null; if (S) draw(); });   // a scroll that started on the graph

load(); if (pins.length) loadDevices(); renderPinned(); setInterval(refresh,30000);
try{ const v = sessionStorage.getItem("house-view"); if (v && v!=="now") show(v); }catch(e){}
document.addEventListener("visibilitychange",()=>{ if (!document.hidden) refresh(); });
</script>
