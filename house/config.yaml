name: House
version: "0.7.1"
slug: house
description: A quiet portal to the house - today's light, shortcuts, motion and what happened.
url: https://github.com/halcyon100/home/tree/main/house
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:home-outline
panel_title: House
panel_admin: false
options:
  circadian_url: http://3dd8a0cc-circadian:8810
  weather: weather.forecast_home
  shortcuts: []
  shades: []
  motion: []
  activity: []
  switches: []
  exclude: []
  floors: []
  rooms: []
schema:
  circadian_url: url
  weather: str?
  shortcuts:
    - name: str
      entity: str
      note: str?
      confirm: bool?
  shades:
    - str
  motion:
    - str
  activity:
    - str
  switches:
    - str
  exclude:
    - str
  floors:
    - str
  rooms:
    - name: str
      floor: str
      controls:
        - str
