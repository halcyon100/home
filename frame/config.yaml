name: Frame
version: "1.7.0"
slug: frame
description: Keeps the Samsung Frame in Art Mode, hangs photos, plays collections and runs its brightness schedule.
url: https://github.com/halcyon100/home/tree/main/frame
arch:
  - amd64
  - aarch64
init: false
host_network: true
services:
  - mqtt:need
startup: application
boot: auto
ports:
  8800/tcp: 8800
ports_description:
  8800/tcp: Frame web app
webui: "http://[HOST]:[PORT:8800]/"
ingress: true
ingress_port: 8800
panel_icon: mdi:image-frame
panel_title: Frame
panel_admin: false
options:
  tv_ip: 192.168.0.60
  tv_mac: ""
schema:
  tv_ip: str
  tv_mac: str?
